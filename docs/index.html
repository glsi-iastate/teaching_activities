<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Soil Texture Calculator & Triangle</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Soil Texture Calculator & Ternary Plot (USDA: Clay–Silt–Sand)</h1>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="panel">
        <div class="row">
          <label for="clay">Clay (%)</label>
          <input id="clay" type="number" min="0" max="100" step="0.1" value="20" />
        </div>

        <div class="row">
          <label for="sand">Sand (%)</label>
          <input id="sand" type="number" min="0" max="100" step="0.1" value="50" />
        </div>

        <div class="row">
          <label for="silt">Silt (%) (calculated)</label>
          <input id="silt" type="number" step="0.1" value="30" readonly />
        </div>

        <div class="row">
          <label for="om">Organic matter (%)</label>
          <input id="om" type="number" min="0" max="100" step="0.1" value="0" />
        </div>

        <div class="porosity-row">
          <div class="porosity-header">
            <label for="porosity">Porosity (%)</label>
            <output id="porosityValue" for="porosity">50</output>
          </div>

          <input
            id="porosity"
            type="range"
            min="0"
            max="90"
            step="0.1"
            value="50"
          />
        </div>

        <div class="help" id="status">
          Enter clay and sand; silt is 100 − clay − sand.
        </div>

        <div class="btns">
          <button id="snap" type="button">Snap to whole %</button>
          <button id="reset" type="button">Reset</button>
        </div>

        <div class="results" aria-live="polite">
          <div class="result-row">
            <span>Texture Class:</span>
            <div id="texClass">—</div>
          </div>

          <div class="result-row">
            <span>Bulk Density<sup>*</sup> (g/cm<sup>3</sup>):</span>
            <output id="bd">—</output>
          </div>

          <div class="result-row">
            <span>Field Capacity (ml/cm<sup>3</sup>):</span>
            <output id="fieldcap">—</output>
          </div>
          
          <div class="result-row">
            <span>Wilting Point (ml/cm<sup>3</sup>):</span>
            <output id="fieldcap">—</output>
          </div>

          <div class="result-row">
            <span>Available Water Capacity (ml/cm<sup>3</sup>):</span>
            <output id="fieldcap">—</output>
          </div>

          <div class="result-row">
            <span>Hydraulic Conductivity (KPa):</span>
            <output id="fieldcap">—</output>
          </div>

        </div>
      </div>
    </section>

    <section class="card">
      <div class="panel chart-panel">
        <div id="chart"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
