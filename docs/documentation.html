<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLSI - Activity Documentation</title>
  <link rel="stylesheet" href="styles.css" />
</head> 
<body>
    <header>
        <a href="https://www.agron.iastate.edu/glsi/" target="_blank" class="header-logo-link">
        <img src="GLSI_Logo.png" alt="White GLSI Logo with Text" class="header-logo" />
        </a>
        <h1>Activity Documentation</h1>
    </header>

    <div class="doc-content">

          </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
    window.MathJax = {
        tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        chtml: {
        displayAlign: 'left'
        }
    };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script src="js/load-markdown.js"></script>
