<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLSI - Activity Documentation</title>
  <link rel="stylesheet" href="styles.css" />
</head> 
<body>
    <header>
        <a href="https://www.agron.iastate.edu/glsi/" target="_blank" class="header-logo-link">
        <img src="GLSI_Logo.png" alt="White GLSI Logo with Text" class="header-logo" />
        </a>
        <h1>Activity Documentation</h1>
    </header>

    <div class="doc-content">
      <section id="details" class="section-text">
          <div>
            <div class="md-content" data-md="soil_triangle\documentation.md"></div>
          </div>
      </section>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", async () => {
        const containers = document.querySelectorAll("[data-md]");

        for (const container of containers) {
        const markdownFile = container.dataset.md;

        try {
            const response = await fetch(markdownFile);

            if (!response.ok) {
            throw new Error(`Could not load ${markdownFile}: ${response.status}`);
            }

            const markdown = await response.text();
            container.innerHTML = marked.parse(markdown);
        } catch (error) {
            console.error(error);
            container.textContent = `Failed to load documentation: ${error.message}`;
        }
        }
    });
    </script>


</body>

</html>
